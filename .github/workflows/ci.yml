name: CI                      # Actions 탭에 보이는 워크플로 이름

on:                           # 언제 돌까
  push:
    branches: [main]          # main에 합쳐졌을 때
  pull_request:               # PR을 올리거나 커밋을 더 올렸을 때

jobs:                         # 무슨 일을 할까
  verify:                     # 잡 이름 (id)
    runs-on: ubuntu-latest    # 어디서: GitHub이 빌려주는 서버
    steps:                    # 위에서 아래로 순서대로
      - uses: actions/checkout@v7     # 저장소 코드를 서버로 내려받는다
      - uses: actions/setup-node@v7   # Node.js를 설치한다
        with:
          node-version-file: .nvmrc   # 버전은 .nvmrc에서 읽는다
          cache: npm                  # 설치한 패키지를 저장해 다음에 빠르게
      - run: npm ci                   # package-lock.json 그대로 설치
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm ci --prefix analyzer          # 분석 도구는 따로 설치한다
      - run: npm run typecheck --prefix analyzer
      - run: npm test --prefix analyzer
      - name: 테스트 결과 파일 남기기
        if: always()                       # 실패해도 남긴다 (분석 워크플로가 읽는다)
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: report.xml
          if-no-files-found: ignore        # 빌드 단계에서 실패해 파일이 없어도 오류로 치지 않는다
