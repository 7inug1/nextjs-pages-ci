name: 배포 (GitHub Pages)

on:
  push:
    branches: [main]          # main에 합쳐질 때마다 배포
  workflow_dispatch:          # Actions 탭에서 수동 실행도 허용

permissions:
  contents: read              # 코드를 읽는다
  pages: write                # Pages에 게시한다
  id-token: write             # 이 저장소의 배포임을 증명하는 임시 토큰(OIDC)

concurrency:
  group: pages
  cancel-in-progress: false   # 진행 중인 배포는 취소하지 않는다 (절반만 올라가는 것을 막음)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v6   # 사이트 주소 정보를 읽는다 (base_path 등)
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}   # 예: /nextjs-pages-ci
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out                      # 이 폴더를 사이트로 올린다

  deploy:
    needs: build                           # 빌드가 성공해야 배포한다
    runs-on: ubuntu-latest
    environment:
      name: github-pages                   # 배포 이력과 주소를 GitHub에 기록한다
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
