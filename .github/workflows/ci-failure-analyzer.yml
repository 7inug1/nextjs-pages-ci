# CI가 실패했을 때만 시작해서 로그를 AI로 분석하고, PR이면 댓글, main이면 이슈로 남긴다.
# workflow_run 워크플로는 기본 브랜치(main)에 있어야 동작한다.
name: CI 실패 분석

on:
  workflow_run:
    workflows: ['CI']          # ci.yml의 name과 글자가 같아야 한다
    types: [completed]

permissions:
  actions: read                # 실패한 실행의 로그와 결과 파일을 읽는다
  contents: read
  pull-requests: write         # PR에 댓글
  issues: write                # 이슈 만들기와 댓글

jobs:
  analyze:
    name: 실패 분석
    # 실패나 시간 초과일 때만, 그리고 이 저장소 안에서 올린 것만 분석한다.
    # 남의 복사본(fork) PR은 건너뛴다: 비밀 키가 걸린 일이라서.
    if: ${{ (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out') && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # 브랜치 이름처럼 바깥에서 오는 값은 명령에 직접 넣지 않고 환경 변수로 받는다
      RUN_ID: ${{ github.event.workflow_run.id }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      EVENT: ${{ github.event.workflow_run.event }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      TSX: ${{ github.workspace }}/analyzer/node_modules/.bin/tsx
      CLI: ${{ github.workspace }}/analyzer/src/cli.ts
    steps:
      # 기본 브랜치(main)의 분석 도구를 받는다. 실패한 PR의 코드는 받지도 실행하지도 않는다.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --prefix analyzer

      - name: 실패한 CI의 로그와 결과 파일과 변경 내용 내려받기
        run: |
          mkdir -p "$RUNNER_TEMP/analysis" && cd "$RUNNER_TEMP/analysis"
          gh run view "$RUN_ID" --log-failed > log.txt
          # 결과 파일이 없는 실패(빌드 실패 등)도 있어서 없어도 계속한다
          gh run download "$RUN_ID" -n test-report -D . || echo "report.xml 없음"
          # 이번 변경 내용(diff): PR이면 PR의 변경, main push면 그 커밋의 변경
          if [ -n "$PR_NUMBER" ]; then
            gh pr diff "$PR_NUMBER" > diff.txt || : > diff.txt
          else
            gh api "repos/$GH_REPO/commits/$SHA" -H "Accept: application/vnd.github.v3.diff" > diff.txt || : > diff.txt
          fi

      - name: main 실패면 같은 실패의 이슈가 이미 있는지 확인
        id: dedupe
        run: |
          cd "$RUNNER_TEMP/analysis"
          echo "repeat=false" >> "$GITHUB_OUTPUT"
          if [ -n "$PR_NUMBER" ]; then echo "PR의 실패: 이슈 확인은 건너뜀"; exit 0; fi
          fp=$("$TSX" "$CLI" fingerprint log.txt report.xml)
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          echo "지문: $fp"
          issue=$(gh issue list --label ci-failure --state open --json number,body --jq ".[]|select(.body|contains(\"fingerprint: $fp\"))|.number" | head -1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "같은 실패가 다시 발생했습니다. 같은 지문의 이슈가 있어 AI 분석은 다시 하지 않았습니다. [실행 기록]($RUN_URL)"
            echo "이슈 #$issue 에 댓글을 남기고 AI는 부르지 않음"
            echo "repeat=true" >> "$GITHUB_OUTPUT"
          fi

      - name: AI로 분석하기
        if: ${{ steps.dedupe.outputs.repeat != 'true' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # 비밀 키는 로그에 *** 로 가려진다
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          cd "$RUNNER_TEMP/analysis"
          "$TSX" "$CLI" analyze log.txt report.xml diff.txt
          cat comment.md

      - name: PR이면 댓글, main이면 이슈로 남기기
        if: ${{ steps.dedupe.outputs.repeat != 'true' }}
        env:
          FP: ${{ steps.dedupe.outputs.fp }}
        run: |
          cd "$RUNNER_TEMP/analysis"
          if [ -n "$PR_NUMBER" ]; then
            gh pr comment "$PR_NUMBER" --body-file comment.md
          else
            gh label create ci-failure --color D93F0B --description "CI 실패 자동 분석" --force > /dev/null
            { cat comment.md; printf '\n\nfingerprint: %s\n' "${FP:-unknown}"; } > issue.md
            gh issue create --title "[CI] $(cat title.txt)" --label ci-failure --body-file issue.md
          fi
